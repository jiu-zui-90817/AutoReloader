# MO / YR 启动器（Win32）
name: Build Launchers

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - "Launcher/**"
      - "assets/**"
      - ".github/workflows/build-launchers.yml"

concurrency:
  group: launchers-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-launchers:
    name: Build MO + YR injectors
    runs-on: windows-2022
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4

      - name: Setup MSVC x86
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x86

      - name: Build MOInjector
        run: |
          New-Item -ItemType Directory -Force -Path build/launchers | Out-Null
          $src = "Launcher/MOInjector.cpp"
          $out = "build/launchers/MO启动器.exe"
          # console 子系统（有日志）
          $icon = ""
          if (Test-Path assets/launcher_mo.ico) {
            # 简易 rc
            Set-Content -Path build/launchers/mo.rc -Encoding ASCII "IDI_ICON1 ICON `"assets/launcher_mo.ico`""
            rc /nologo /fo build/launchers/mo.res build/launchers/mo.rc
            if ($LASTEXITCODE -eq 0) { $icon = "build/launchers/mo.res" }
          }
          $cmd = "cl /nologo /EHsc /O2 /Fe:`"$out`" `"$src`" user32.lib advapi32.lib shell32.lib"
          if ($icon) { $cmd += " $icon" }
          Write-Host $cmd
          cmd /c $cmd
          if ($LASTEXITCODE -ne 0) { throw "MOInjector build failed" }
          if (-not (Test-Path $out)) { throw "MO exe missing" }

      - name: Build YRInjector
        run: |
          $src = "Launcher/YRInjector.cpp"
          $out = "build/launchers/YR启动器.exe"
          $icon = ""
          if (Test-Path assets/launcher_yr.ico) {
            Set-Content -Path build/launchers/yr.rc -Encoding ASCII "IDI_ICON1 ICON `"assets/launcher_yr.ico`""
            rc /nologo /fo build/launchers/yr.res build/launchers/yr.rc
            if ($LASTEXITCODE -eq 0) { $icon = "build/launchers/yr.res" }
          }
          # WinMain → 需要 SUBSYSTEM:WINDOWS
          $cmd = "cl /nologo /EHsc /O2 /Fe:`"$out`" `"$src`" user32.lib advapi32.lib shell32.lib gdi32.lib comctl32.lib /link /SUBSYSTEM:WINDOWS"
          if ($icon) { $cmd += " $icon" }
          Write-Host $cmd
          cmd /c $cmd
          if ($LASTEXITCODE -ne 0) { throw "YRInjector build failed" }
          if (-not (Test-Path $out)) { throw "YR exe missing" }

      - name: Pack
        run: |
          $root = "启动器"
          Remove-Item -Recurse -Force $root -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path $root | Out-Null
          Copy-Item "build/launchers/MO启动器.exe" $root/
          Copy-Item "build/launchers/YR启动器.exe" $root/
          if (Test-Path Config/ReloaderConfig.ini) {
            Copy-Item Config/ReloaderConfig.ini $root/
          }
          @"
          启动器说明
          - MO启动器.exe：启动 Mental Omega 客户端并注入 AutoReloader.dll
          - YR启动器.exe：YR/Ares 引导并注入 AutoReloader.dll
          请与 AutoReloader.dll、ReloaderConfig.ini 放在同一游戏目录。
          "@ | Set-Content -Encoding utf8 "$root/说明.txt"
          Get-ChildItem $root

      - uses: actions/upload-artifact@v4
        with:
          name: 启动器
          path: 启动器/
          if-no-files-found: error
