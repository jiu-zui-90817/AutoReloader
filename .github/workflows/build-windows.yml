# 双版本前端打包：每个前端各出 PyInstaller 单文件 + Nuitka 单文件
# common_flags：仓库唯一源 shared/schemas/ → 构建前同步到各工具 schemas/ → 打进包内
name: Build Windows Frontends

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - "Frontend/**"
      - "shared/**"
      - ".github/workflows/build-windows.yml"

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.12"

jobs:
  # ---------- 同步词典到各工具（唯一源 shared/schemas）----------
  # 每个 job 自己 sync，避免跨 job 传 artifact 的麻烦

  editor-pyinstaller:
    name: Editor · PyInstaller onefile
    runs-on: windows-latest
    defaults:
      run:
        working-directory: Frontend/editor
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Sync common_flags from shared
        working-directory: .
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path Frontend/editor/schemas | Out-Null
          Copy-Item -Force shared/schemas/common_flags.json Frontend/editor/schemas/common_flags.json
          Write-Host "editor schemas synced from shared"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller
      - name: Build
        shell: pwsh
        run: |
          pyinstaller --noconfirm --clean --onefile --windowed `
            --name "MO_INI_Editor" `
            --add-data "config.json;." `
            --add-data "schemas;schemas" `
            --add-data "使用说明.txt;." `
            main.py
      - name: Pack
        shell: pwsh
        run: |
          $out = "MO_INI_Editor-PyInstaller"
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          Copy-Item dist/MO_INI_Editor.exe $out/
          Copy-Item config.json $out/
          Copy-Item -Recurse schemas $out/
          if (Test-Path "使用说明.txt") { Copy-Item "使用说明.txt" $out/ }
          Compress-Archive -Path "$out/*" -DestinationPath "MO_INI_Editor-PyInstaller.zip" -Force
      - uses: actions/upload-artifact@v4
        with:
          name: MO_INI_Editor-PyInstaller
          path: Frontend/editor/MO_INI_Editor-PyInstaller.zip
          if-no-files-found: error

  editor-nuitka:
    name: Editor · Nuitka onefile
    runs-on: windows-latest
    timeout-minutes: 120
    defaults:
      run:
        working-directory: Frontend/editor
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Sync common_flags from shared
        working-directory: .
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path Frontend/editor/schemas | Out-Null
          Copy-Item -Force shared/schemas/common_flags.json Frontend/editor/schemas/common_flags.json
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt nuitka ordered-set zstandard
      - name: Build Nuitka
        shell: pwsh
        run: |
          python -m nuitka `
            --onefile `
            --windows-console-mode=disable `
            --enable-plugin=pyside6 `
            --assume-yes-for-downloads `
            --msvc=latest `
            --output-dir=dist_nuitka `
            --output-filename=MO_INI_Editor.exe `
            --include-data-files=config.json=config.json `
            --include-data-dir=schemas=schemas `
            --include-data-files=使用说明.txt=使用说明.txt `
            --nofollow-import-to=tkinter `
            --remove-output `
            main.py
      - name: Pack
        shell: pwsh
        run: |
          $out = "MO_INI_Editor-Nuitka"
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          Copy-Item dist_nuitka/MO_INI_Editor.exe $out/
          Copy-Item config.json $out/
          Copy-Item -Recurse schemas $out/
          if (Test-Path "使用说明.txt") { Copy-Item "使用说明.txt" $out/ }
          Compress-Archive -Path "$out/*" -DestinationPath "MO_INI_Editor-Nuitka.zip" -Force
      - uses: actions/upload-artifact@v4
        with:
          name: MO_INI_Editor-Nuitka
          path: Frontend/editor/MO_INI_Editor-Nuitka.zip
          if-no-files-found: error

  workshop-pyinstaller:
    name: Workshop · PyInstaller onefile
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Sync common_flags from shared
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path Frontend/workshop/schemas | Out-Null
          Copy-Item -Force shared/schemas/common_flags.json Frontend/workshop/schemas/common_flags.json
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r Frontend/workshop/requirements.txt pyinstaller
      - name: Build
        shell: pwsh
        run: |
          pyinstaller --noconfirm --clean --onefile --windowed `
            --name "TacticalWorkshop" `
            --paths . `
            --hidden-import shared.ini_loader `
            --hidden-import shared.csf_loader `
            --hidden-import shared.hotfix_io `
            --hidden-import shared.project_scan `
            --hidden-import shared.codex_builder `
            --add-data "shared/profiles.json;shared" `
            --add-data "shared/schemas;shared/schemas" `
            --add-data "Frontend/workshop/schemas;schemas" `
            Frontend/workshop/main.py
      - name: Pack
        shell: pwsh
        run: |
          $out = "TacticalWorkshop-PyInstaller"
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          Copy-Item dist/TacticalWorkshop.exe $out/
          Copy-Item shared/profiles.json $out/
          New-Item -ItemType Directory -Force -Path "$out/schemas" | Out-Null
          Copy-Item -Force shared/schemas/common_flags.json "$out/schemas/"
          New-Item -ItemType Directory -Force -Path "$out/shared/schemas" | Out-Null
          Copy-Item -Force shared/schemas/common_flags.json "$out/shared/schemas/"
          if (Test-Path Frontend/workshop/README.md) { Copy-Item Frontend/workshop/README.md "$out/README.md" }
          Compress-Archive -Path "$out/*" -DestinationPath "TacticalWorkshop-PyInstaller.zip" -Force
      - uses: actions/upload-artifact@v4
        with:
          name: TacticalWorkshop-PyInstaller
          path: TacticalWorkshop-PyInstaller.zip
          if-no-files-found: error

  workshop-nuitka:
    name: Workshop · Nuitka onefile
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Sync common_flags from shared
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path Frontend/workshop/schemas | Out-Null
          Copy-Item -Force shared/schemas/common_flags.json Frontend/workshop/schemas/common_flags.json
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r Frontend/workshop/requirements.txt nuitka ordered-set zstandard
      - name: Build Nuitka onefile
        shell: pwsh
        run: |
          $env:PYTHONPATH = (Resolve-Path .).Path
          Push-Location Frontend/workshop
          python -m nuitka `
            --onefile `
            --windows-console-mode=disable `
            --enable-plugin=pyside6 `
            --assume-yes-for-downloads `
            --msvc=latest `
            --output-dir=../../dist_nuitka `
            --output-filename=TacticalWorkshop.exe `
            --include-package=shared `
            --include-data-files=../../shared/profiles.json=shared/profiles.json `
            --include-data-dir=../../shared/schemas=shared/schemas `
            --include-data-dir=schemas=schemas `
            --nofollow-import-to=tkinter `
            --remove-output `
            main.py
          Pop-Location
      - name: Pack
        shell: pwsh
        run: |
          $out = "TacticalWorkshop-Nuitka"
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          Copy-Item dist_nuitka/TacticalWorkshop.exe $out/
          Copy-Item shared/profiles.json $out/
          New-Item -ItemType Directory -Force -Path "$out/schemas" | Out-Null
          Copy-Item -Force shared/schemas/common_flags.json "$out/schemas/"
          New-Item -ItemType Directory -Force -Path "$out/shared/schemas" | Out-Null
          Copy-Item -Force shared/schemas/common_flags.json "$out/shared/schemas/"
          if (Test-Path Frontend/workshop/README.md) { Copy-Item Frontend/workshop/README.md "$out/README.md" }
          Compress-Archive -Path "$out/*" -DestinationPath "TacticalWorkshop-Nuitka.zip" -Force
      - uses: actions/upload-artifact@v4
        with:
          name: TacticalWorkshop-Nuitka
          path: TacticalWorkshop-Nuitka.zip
          if-no-files-found: error
