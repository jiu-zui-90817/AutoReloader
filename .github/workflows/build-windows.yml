# 编辑器 + 工坊 · PyInstaller 目录版（onedir）
# - 不再默认 onefile / Nuitka（体积大、临时目录导致配置与词典难持久化）
# - 解压后整目录运行；可写配置/缓存落在程序目录旁
# 构建前同步 shared/schemas → 各工具 schemas
name: Build Windows Frontends

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - "Frontend/**"
      - "shared/**"
      - ".github/workflows/build-windows.yml"

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.12"

jobs:
  editor-pyinstaller:
    name: Editor · PyInstaller onedir
    runs-on: windows-latest
    defaults:
      run:
        working-directory: Frontend/editor
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Sync common_flags from shared
        working-directory: .
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path Frontend/editor/schemas | Out-Null
          Copy-Item -Force shared/schemas/common_flags.json Frontend/editor/schemas/common_flags.json
          if (-not (Test-Path Frontend/editor/schemas/common_flags.json)) { throw "schema sync failed" }
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller
      - name: Build (onedir)
        shell: pwsh
        run: |
          pyinstaller --noconfirm --clean --onedir --windowed `
            --name "MO_INI_Editor" `
            --add-data "config.json;." `
            --add-data "schemas;schemas" `
            --collect-all PySide6 `
            main.py
      - name: Pack
        shell: pwsh
        run: |
          $out = "MO_INI_Editor-PyInstaller"
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          Copy-Item -Recurse dist/MO_INI_Editor/* $out/
          New-Item -ItemType Directory -Force -Path "$out/data" | Out-Null
          if (Test-Path "使用说明.txt") { Copy-Item "使用说明.txt" $out/ }
          @"
          使用说明（打包版）
          1. 解压整个文件夹后运行 MO_INI_Editor.exe（不要只复制单个 exe）
          2. 用户配置写入本目录 config.json（或用户目录回退路径）
          3. schemas 为只读资源；data 目录可放缓存
          "@ | Set-Content -Encoding UTF8 "$out/打包说明.txt"
          Compress-Archive -Path "$out/*" -DestinationPath "MO_INI_Editor-PyInstaller.zip" -Force
      - uses: actions/upload-artifact@v4
        with:
          name: MO_INI_Editor-PyInstaller
          path: Frontend/editor/MO_INI_Editor-PyInstaller.zip
          if-no-files-found: error

  workshop-pyinstaller:
    name: Workshop · PyInstaller onedir
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Sync common_flags from shared
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path Frontend/workshop/schemas | Out-Null
          Copy-Item -Force shared/schemas/common_flags.json Frontend/workshop/schemas/common_flags.json
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r Frontend/workshop/requirements.txt pyinstaller
      - name: Build (onedir)
        shell: pwsh
        run: |
          pyinstaller --noconfirm --clean --onedir --windowed `
            --name "TacticalWorkshop" `
            --paths . `
            --paths Frontend/workshop `
            --hidden-import=app `
            --hidden-import=fields `
            --hidden-import=shared `
            --hidden-import=shared.ini_loader `
            --hidden-import=shared.csf_loader `
            --hidden-import=shared.hotfix_io `
            --hidden-import=shared.project_scan `
            --hidden-import=shared.codex_builder `
            --collect-submodules=shared `
            --collect-all=PySide6 `
            --add-data "shared/profiles.json;shared" `
            --add-data "shared/schemas;shared/schemas" `
            --add-data "Frontend/workshop/schemas;schemas" `
            Frontend/workshop/main.py
      - name: Pack
        shell: pwsh
        run: |
          $out = "TacticalWorkshop-PyInstaller"
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          Copy-Item -Recurse dist/TacticalWorkshop/* $out/
          New-Item -ItemType Directory -Force -Path "$out/data/cache" | Out-Null
          New-Item -ItemType Directory -Force -Path "$out/shared/schemas" | Out-Null
          Copy-Item shared/profiles.json "$out/shared/"
          Copy-Item -Force shared/schemas/common_flags.json "$out/shared/schemas/"
          New-Item -ItemType Directory -Force -Path "$out/schemas" | Out-Null
          Copy-Item -Force shared/schemas/common_flags.json "$out/schemas/"
          if (Test-Path Frontend/workshop/README.md) { Copy-Item Frontend/workshop/README.md "$out/README.md" }
          @"
          使用说明（打包版）
          1. 解压整个文件夹后运行 TacticalWorkshop.exe
          2. 上次路径：console_config.json（程序目录优先）
          3. 词典缓存：data\cache\ 或程序目录 cache\（勿依赖系统 Temp）
          "@ | Set-Content -Encoding UTF8 "$out/打包说明.txt"
          Compress-Archive -Path "$out/*" -DestinationPath "TacticalWorkshop-PyInstaller.zip" -Force
      - uses: actions/upload-artifact@v4
        with:
          name: TacticalWorkshop-PyInstaller
          path: TacticalWorkshop-PyInstaller.zip
          if-no-files-found: error
