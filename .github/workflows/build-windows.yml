# 编辑器 + 战术工坊（仅 Nuitka）→ 一个中文发布目录
# 注意：不要预打 zip，upload-artifact 下载时会再压一层
name: Build Windows Frontends

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - "Frontend/**"
      - "shared/**"
      - ".github/workflows/build-windows.yml"

concurrency:
  group: frontend-build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.12"

jobs:
  build-editor:
    name: Build editor
    runs-on: windows-2022
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: Frontend/editor/requirements.txt
      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - name: Sync schemas
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path Frontend/editor/schemas | Out-Null
          Copy-Item -Force shared/schemas/common_flags.json Frontend/editor/schemas/common_flags.json
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r Frontend/editor/requirements.txt
          pip install nuitka ordered-set zstandard
      - name: Nuitka onefile
        working-directory: Frontend/editor
        shell: pwsh
        run: |
          # 先用 ASCII 文件名，避免 runner 代码页问题；打包阶段再改中文名
          $iconArgs = @()
          if (Test-Path ../../assets/editor.ico) {
            $iconArgs = @("--windows-icon-from-ico=../../assets/editor.ico")
          }
          python -m nuitka `
            --onefile `
            --windows-console-mode=disable `
            --enable-plugin=pyside6 `
            --assume-yes-for-downloads `
            --msvc=latest `
            @iconArgs `
            --output-dir=../../build/editor `
            --output-filename=MO_INI_Editor.exe `
            --include-data-files=config.json=config.json `
            --include-data-dir=schemas=schemas `
            --include-module=paths `
            --include-package=core `
            --include-package=ui `
            --nofollow-import-to=tkinter `
            --remove-output `
            main.py
          if ($LASTEXITCODE -ne 0) { throw "Nuitka editor build failed: $LASTEXITCODE" }
          if (-not (Test-Path ../../build/editor/MO_INI_Editor.exe)) { throw "exe missing" }
      - uses: actions/upload-artifact@v4
        with:
          name: build-editor-bin
          path: build/editor/MO_INI_Editor.exe
          if-no-files-found: error

  build-workshop:
    name: Build workshop
    runs-on: windows-2022
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: Frontend/workshop/requirements.txt
      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - name: Sync schemas
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path Frontend/workshop/schemas | Out-Null
          Copy-Item -Force shared/schemas/common_flags.json Frontend/workshop/schemas/common_flags.json
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r Frontend/workshop/requirements.txt
          pip install nuitka ordered-set zstandard
      - name: Nuitka onefile
        shell: pwsh
        run: |
          $env:PYTHONPATH = (Resolve-Path .).Path
          Push-Location Frontend/workshop
          $iconArgs = @()
          if (Test-Path ../../assets/workshop.ico) {
            $iconArgs = @("--windows-icon-from-ico=../../assets/workshop.ico")
          }
          python -m nuitka `
            --onefile `
            --windows-console-mode=disable `
            --enable-plugin=pyside6 `
            --assume-yes-for-downloads `
            --msvc=latest `
            @iconArgs `
            --output-dir=../../build/workshop `
            --output-filename=TacticalWorkshop.exe `
            --include-package=shared `
            --include-module=app `
            --include-module=fields `
            --include-data-files=../../shared/profiles.json=profiles.json `
            --include-data-dir=../../shared/schemas=shared/schemas `
            --include-data-dir=schemas=schemas `
            --nofollow-import-to=tkinter `
            --remove-output `
            main.py
          $code = $LASTEXITCODE
          Pop-Location
          if ($code -ne 0) { throw "Nuitka workshop build failed: $code" }
          if (-not (Test-Path build/workshop/TacticalWorkshop.exe)) { throw "exe missing" }
      - uses: actions/upload-artifact@v4
        with:
          name: build-workshop-bin
          path: build/workshop/TacticalWorkshop.exe
          if-no-files-found: error

  pack-release:
    name: Pack Chinese release
    needs: [build-editor, build-workshop]
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Download editor bin
        uses: actions/download-artifact@v4
        with:
          name: build-editor-bin
          path: bins/editor
      - name: Download workshop bin
        uses: actions/download-artifact@v4
        with:
          name: build-workshop-bin
          path: bins/workshop
      - name: Assemble
        shell: pwsh
        run: |
          $root = "热重载前端工具"
          Remove-Item -Recurse -Force $root -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path "$root/INI工程编辑器" | Out-Null
          New-Item -ItemType Directory -Force -Path "$root/战术工坊" | Out-Null

          Copy-Item "bins/editor/MO_INI_Editor.exe" "$root/INI工程编辑器/INI工程编辑器.exe"
          Copy-Item Frontend/editor/config.json "$root/INI工程编辑器/"
          New-Item -ItemType Directory -Force -Path "$root/INI工程编辑器/schemas" | Out-Null
          Copy-Item -Force shared/schemas/common_flags.json "$root/INI工程编辑器/schemas/"
          if (Test-Path Frontend/editor/使用说明.txt) {
            Copy-Item Frontend/editor/使用说明.txt "$root/INI工程编辑器/"
          }

          Copy-Item "bins/workshop/TacticalWorkshop.exe" "$root/战术工坊/战术工坊.exe"
          Copy-Item shared/profiles.json "$root/战术工坊/profiles.json"
          New-Item -ItemType Directory -Force -Path "$root/战术工坊/schemas" | Out-Null
          Copy-Item -Force shared/schemas/common_flags.json "$root/战术工坊/schemas/"
          if (Test-Path Frontend/workshop/README.md) {
            Copy-Item Frontend/workshop/README.md "$root/战术工坊/说明.txt"
          }

          @"
          热重载前端工具

          INI工程编辑器\  — 工程级 INI 编辑
          战术工坊\      — 快调并部署 hotfix.ini

          1. Actions 下载的 zip 解压一次即可（不要再套压缩包）。
          2. 解压到可写目录再运行。
          3. 配置/缓存优先写在程序目录；不可写时用 %LocalAppData%\MO_INI_Editor 与 TacticalWorkshop。
          "@ | Set-Content -Encoding utf8 "$root/使用说明.txt"

          Get-ChildItem -Recurse $root | Format-Table FullName, Length
      - uses: actions/upload-artifact@v4
        with:
          name: 热重载前端工具
          path: 热重载前端工具/
          if-no-files-found: error
