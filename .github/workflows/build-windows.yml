# 仅 Nuitka 单文件：编辑器 + 战术工坊 → 一个中文名发布包（无嵌套 zip）
name: Build Windows Frontends

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - "Frontend/**"
      - "shared/**"
      - ".github/workflows/build-windows.yml"

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.12"

jobs:
  release-frontend:
    name: 热重载前端工具（Nuitka）
    runs-on: windows-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Sync common_flags from shared
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path Frontend/editor/schemas | Out-Null
          New-Item -ItemType Directory -Force -Path Frontend/workshop/schemas | Out-Null
          Copy-Item -Force shared/schemas/common_flags.json Frontend/editor/schemas/common_flags.json
          Copy-Item -Force shared/schemas/common_flags.json Frontend/workshop/schemas/common_flags.json

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r Frontend/editor/requirements.txt
          pip install -r Frontend/workshop/requirements.txt
          pip install nuitka ordered-set zstandard

      # ---------- 编辑器 ----------
      - name: Build 编辑器 (Nuitka onefile)
        shell: pwsh
        working-directory: Frontend/editor
        run: |
          python -m nuitka `
            --onefile `
            --windows-console-mode=disable `
            --enable-plugin=pyside6 `
            --assume-yes-for-downloads `
            --msvc=latest `
            --output-dir=../../build/editor `
            --output-filename=INI工程编辑器.exe `
            --include-data-files=config.json=config.json `
            --include-data-dir=schemas=schemas `
            --include-module=paths `
            --include-package=core `
            --include-package=ui `
            --nofollow-import-to=tkinter `
            --remove-output `
            main.py

      # ---------- 工坊 ----------
      - name: Build 战术工坊 (Nuitka onefile)
        shell: pwsh
        run: |
          $env:PYTHONPATH = (Resolve-Path .).Path
          Push-Location Frontend/workshop
          python -m nuitka `
            --onefile `
            --windows-console-mode=disable `
            --enable-plugin=pyside6 `
            --assume-yes-for-downloads `
            --msvc=latest `
            --output-dir=../../build/workshop `
            --output-filename=战术工坊.exe `
            --include-package=shared `
            --include-module=app `
            --include-module=fields `
            --include-data-files=../../shared/profiles.json=shared/profiles.json `
            --include-data-dir=../../shared/schemas=shared/schemas `
            --include-data-dir=schemas=schemas `
            --nofollow-import-to=tkinter `
            --remove-output `
            main.py
          Pop-Location

      # ---------- 组装单一发布目录并打一次 zip ----------
      - name: Assemble release folder
        shell: pwsh
        run: |
          $root = "热重载前端工具"
          Remove-Item -Recurse -Force $root -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path "$root/INI工程编辑器" | Out-Null
          New-Item -ItemType Directory -Force -Path "$root/战术工坊" | Out-Null

          # 编辑器
          Copy-Item "build/editor/INI工程编辑器.exe" "$root/INI工程编辑器/"
          Copy-Item Frontend/editor/config.json "$root/INI工程编辑器/"
          New-Item -ItemType Directory -Force -Path "$root/INI工程编辑器/schemas" | Out-Null
          Copy-Item -Force shared/schemas/common_flags.json "$root/INI工程编辑器/schemas/"
          if (Test-Path Frontend/editor/使用说明.txt) {
            Copy-Item Frontend/editor/使用说明.txt "$root/INI工程编辑器/"
          }

          # 工坊
          Copy-Item "build/workshop/战术工坊.exe" "$root/战术工坊/"
          New-Item -ItemType Directory -Force -Path "$root/战术工坊/shared/schemas" | Out-Null
          Copy-Item shared/profiles.json "$root/战术工坊/shared/"
          Copy-Item -Force shared/schemas/common_flags.json "$root/战术工坊/shared/schemas/"
          New-Item -ItemType Directory -Force -Path "$root/战术工坊/schemas" | Out-Null
          Copy-Item -Force shared/schemas/common_flags.json "$root/战术工坊/schemas/"
          if (Test-Path Frontend/workshop/README.md) {
            Copy-Item Frontend/workshop/README.md "$root/战术工坊/说明.txt"
          }

          @"
          热重载前端工具（测试/发布包）

          目录说明：
            INI工程编辑器\   — 工程级 INI 编辑
            战术工坊\       — 快调参数并部署 hotfix.ini

          使用注意：
          1. 请解压到可写目录后再运行（不要直接在压缩包里双击）。
          2. 首次运行会在程序目录写入配置与缓存；若目录只读，将改写到：
               %LocalAppData%\MO_INI_Editor\
               %LocalAppData%\TacticalWorkshop\
          3. 属性说明词典唯一源为仓库 shared/schemas/common_flags.json（已打入 schemas）。
          4. 本包为 Nuitka 单文件构建，不再提供 PyInstaller 版本。
          "@ | Set-Content -Encoding UTF8 "$root/使用说明.txt"

          # 只打一层 zip：里面是文件夹，不要 zip 再套 zip
          if (Test-Path "热重载前端工具.zip") { Remove-Item "热重载前端工具.zip" }
          Compress-Archive -Path "$root" -DestinationPath "热重载前端工具.zip" -Force
          Get-Item "热重载前端工具.zip" | Format-List Name, Length, FullName

      - uses: actions/upload-artifact@v4
        with:
          name: 热重载前端工具
          path: 热重载前端工具.zip
          if-no-files-found: error
