# 发布工作流：引擎 + 启动器 + 编辑器 + 工坊 → MO/YR 包
# 触发方式：
#   1. 推送版本 tag：git tag v1.2.0 && git push origin v1.2.0
#   2. Actions 页手动 Run workflow（可选勾选创建 Release）
name: Build Release

on:
  workflow_dispatch:
    inputs:
      create_release:
        description: "构建完成后创建 GitHub Release 并上传压缩包"
        type: boolean
        default: true
      tag_name:
        description: "Release 使用的 tag（手动运行时必填，如 v1.2.0；推送 tag 触发时可留空）"
        type: string
        default: ""
  push:
    tags:
      - "v*"

concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

env:
  PYTHON_VERSION: "3.12"

jobs:
  # ========== 32 位引擎 DLL ==========
  build-dll:
    name: AutoReloader.dll
    runs-on: windows-2022
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x86
      - name: Clone YRpp
        run: |
          if (-not (Test-Path Backend/YRpp/.git)) {
            git clone --depth 1 https://github.com/Phobos-developers/YRpp.git Backend/YRpp
          }
      - name: Configure & Build
        working-directory: Backend
        run: |
          $built = $false
          cmake -B build -G "Visual Studio 17 2022" -A Win32
          if ($LASTEXITCODE -eq 0) {
            cmake --build build --config Release -- /m
            if ($LASTEXITCODE -eq 0) { $built = $true }
          }
          if (-not $built) {
            if (-not (Get-Command ninja -ErrorAction SilentlyContinue)) {
              choco install ninja -y --no-progress
            }
            if (Test-Path build) { Remove-Item -Recurse -Force build }
            cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
            if ($LASTEXITCODE -ne 0) { throw "cmake configure failed" }
            cmake --build build --parallel
            if ($LASTEXITCODE -ne 0) { throw "cmake build failed" }
          }
      - name: Collect
        run: |
          $dll = Get-ChildItem Backend -Recurse -Filter AutoReloader.dll |
            Select-Object -First 1
          if (-not $dll) { throw "AutoReloader.dll not found" }
          New-Item -ItemType Directory -Force -Path dist/engine | Out-Null
          Copy-Item $dll.FullName dist/engine/AutoReloader.dll
          if (Test-Path Config/ReloaderConfig.ini) {
            Copy-Item Config/ReloaderConfig.ini dist/engine/
          }
      - uses: actions/upload-artifact@v4
        with:
          name: engine
          path: dist/engine/
          if-no-files-found: error

  # ========== 启动器 x86 ==========
  build-launchers:
    name: Launchers
    runs-on: windows-2022
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x86
      - name: Build
        run: |
          New-Item -ItemType Directory -Force -Path dist/launchers | Out-Null
          cl /nologo /EHsc /O2 /Fe:"dist/launchers/MOLauncher.exe" Launcher/MOInjector.cpp user32.lib advapi32.lib shell32.lib /link /MANIFEST:EMBED /MANIFESTINPUT:"Launcher/app.manifest" /MANIFESTUAC:NO
          if ($LASTEXITCODE -ne 0) { throw "MO launcher failed" }
          cl /nologo /EHsc /O2 /Fe:"dist/launchers/YRLauncher.exe" Launcher/YRInjector.cpp user32.lib advapi32.lib shell32.lib gdi32.lib comctl32.lib /link /SUBSYSTEM:WINDOWS /MANIFEST:EMBED /MANIFESTINPUT:"Launcher/app.manifest" /MANIFESTUAC:NO
          if ($LASTEXITCODE -ne 0) { throw "YR launcher failed" }
          Get-ChildItem dist/launchers
      - uses: actions/upload-artifact@v4
        with:
          name: launchers
          path: dist/launchers/
          if-no-files-found: error

  # ========== 编辑器（独立 standalone）==========
  build-editor:
    name: Editor
    runs-on: windows-2022
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: Frontend/editor/requirements.txt
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - name: Prepare resources
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path Frontend/editor/schemas | Out-Null
          Copy-Item -Force shared/schemas/common_flags.json Frontend/editor/schemas/common_flags.json
          if (-not (Test-Path Frontend/editor/config.json)) { throw "config.json missing" }
          if (-not (Test-Path Frontend/editor/schemas/common_flags.json)) { throw "schemas missing" }
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r Frontend/editor/requirements.txt nuitka ordered-set zstandard
      - name: Nuitka standalone (editor)
        working-directory: Frontend/editor
        shell: pwsh
        run: |
          $iconArgs = @()
          if (Test-Path ../../assets/editor.ico) {
            $iconArgs += "--windows-icon-from-ico=../../assets/editor.ico"
          }

          # force 控制台 + 强制把 stdout/stderr 写到文件，彻底解决“双击无反应”无法调试的问题
          python -m nuitka `
            --standalone `
            --windows-console-mode=force `
            --force-stdout-spec=INIEditor.out.txt `
            --force-stderr-spec=INIEditor.err.txt `
            --enable-plugin=pyside6 `
            --assume-yes-for-downloads `
            --msvc=latest `
            @iconArgs `
            --output-dir=../../build/editor `
            --output-filename=INIEditor.exe `
            --include-data-files=config.json=config.json `
            --include-data-dir=schemas=schemas `
            --include-module=paths `
            --include-package=core `
            --include-package=ui `
            --include-module=core.dependency_view `
            --include-module=core.linter `
            --include-module=core.save_util `
            --include-module=ui.ini_highlighter `
            --nofollow-import-to=tkinter `
            --remove-output `
            main.py

          if ($LASTEXITCODE -ne 0) { throw "Nuitka editor failed" }

      - name: Stage editor (完整 .dist)
        shell: pwsh
        run: |
          $out = "dist/editor"
          Remove-Item -Recurse -Force $out -ErrorAction SilentlyContinue

          $dist = Get-ChildItem -Path build/editor -Directory -Filter "*.dist" | Select-Object -First 1
          if (-not $dist) { throw "editor .dist not found under build/editor" }
          Write-Host "Using dist:" $dist.FullName

          New-Item -ItemType Directory -Force -Path $out | Out-Null
          Copy-Item -Path (Join-Path $dist.FullName "*") -Destination $out -Recurse -Force

          # 统一主程序名
          $exe = Get-ChildItem $out -Filter "*.exe" | Select-Object -First 1
          if (-not $exe) { throw "no exe in editor dist" }
          if ($exe.Name -ne "INIEditor.exe") {
            Move-Item -Force $exe.FullName (Join-Path $out "INIEditor.exe")
          }

          # 旁路资源
          Copy-Item -Force Frontend/editor/config.json "$out/config.json"
          New-Item -ItemType Directory -Force -Path "$out/schemas" | Out-Null
          Copy-Item -Force shared/schemas/common_flags.json "$out/schemas/common_flags.json"
          if (Test-Path Frontend/editor/使用说明.txt) {
            Copy-Item -Force Frontend/editor/使用说明.txt "$out/"
          }

          # ========== 完整性检查（非常重要）==========
          $fileCount = (Get-ChildItem $out -Recurse -File).Count
          Write-Host "Editor file count: $fileCount"
          if ($fileCount -lt 100) {
            throw "editor dist too small ($fileCount files), incomplete packaging"
          }

          if (-not (Test-Path "$out/INIEditor.exe")) { throw "missing INIEditor.exe" }
          if (-not (Test-Path "$out/config.json")) { throw "missing config.json" }
          if (-not (Test-Path "$out/schemas/common_flags.json")) { throw "missing schemas/common_flags.json" }
          if (-not (Test-Path "$out/PySide6")) { throw "missing PySide6 folder" }

          $qwindows = Get-ChildItem $out -Recurse -Filter "qwindows.dll" | Select-Object -First 1
          if (-not $qwindows) {
            throw "missing qwindows.dll (Qt platform plugin) - editor will not start"
          }
          Write-Host "Found qwindows.dll at:" $qwindows.FullName
          Write-Host "Editor stage OK, files:" $fileCount

      - uses: actions/upload-artifact@v4
        with:
          name: editor-bundle
          path: dist/editor/
          if-no-files-found: error

  # ========== 工坊（独立 standalone）==========
  build-workshop:
    name: Workshop
    runs-on: windows-2022
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: Frontend/workshop/requirements.txt
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - name: Prepare resources
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path Frontend/workshop/schemas | Out-Null
          Copy-Item -Force shared/schemas/common_flags.json Frontend/workshop/schemas/common_flags.json
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r Frontend/workshop/requirements.txt nuitka ordered-set zstandard
      - name: Nuitka standalone (workshop)
        shell: pwsh
        run: |
          $env:PYTHONPATH = (Resolve-Path .).Path
          Push-Location Frontend/workshop

          $iconArgs = @()
          if (Test-Path ../../assets/workshop.ico) {
            $iconArgs += "--windows-icon-from-ico=../../assets/workshop.ico"
          }

          python -m nuitka `
            --standalone `
            --windows-console-mode=force `
            --force-stdout-spec=Workshop.out.txt `
            --force-stderr-spec=Workshop.err.txt `
            --enable-plugin=pyside6 `
            --assume-yes-for-downloads `
            --msvc=latest `
            @iconArgs `
            --output-dir=../../build/workshop `
            --output-filename=Workshop.exe `
            --include-package=shared `
            --include-module=app `
            --include-module=fields `
            --include-data-files=../../shared/profiles.json=profiles.json `
            --include-data-dir=schemas=schemas `
            --nofollow-import-to=tkinter `
            --remove-output `
            main.py

          $code = $LASTEXITCODE
          Pop-Location
          if ($code -ne 0) { throw "Nuitka workshop failed" }

      - name: Stage workshop (完整 .dist)
        shell: pwsh
        run: |
          $out = "dist/workshop"
          Remove-Item -Recurse -Force $out -ErrorAction SilentlyContinue

          $dist = Get-ChildItem -Path build/workshop -Directory -Filter "*.dist" | Select-Object -First 1
          if (-not $dist) { throw "workshop .dist not found under build/workshop" }
          Write-Host "Using dist:" $dist.FullName

          New-Item -ItemType Directory -Force -Path $out | Out-Null
          Copy-Item -Path (Join-Path $dist.FullName "*") -Destination $out -Recurse -Force

          $exe = Get-ChildItem $out -Filter "*.exe" | Select-Object -First 1
          if (-not $exe) { throw "no exe in workshop dist" }
          if ($exe.Name -ne "Workshop.exe") {
            Move-Item -Force $exe.FullName (Join-Path $out "Workshop.exe")
          }

          Copy-Item -Force shared/profiles.json "$out/profiles.json"
          New-Item -ItemType Directory -Force -Path "$out/schemas" | Out-Null
          Copy-Item -Force shared/schemas/common_flags.json "$out/schemas/common_flags.json"
          if (Test-Path Frontend/workshop/README.md) {
            Copy-Item -Force Frontend/workshop/README.md "$out/说明.txt"
          }

          # ========== 完整性检查 ==========
          $fileCount = (Get-ChildItem $out -Recurse -File).Count
          Write-Host "Workshop file count: $fileCount"
          if ($fileCount -lt 80) {
            throw "workshop dist too small ($fileCount files), incomplete packaging"
          }

          if (-not (Test-Path "$out/Workshop.exe")) { throw "missing Workshop.exe" }
          if (-not (Test-Path "$out/profiles.json")) { throw "missing profiles.json" }
          if (-not (Test-Path "$out/schemas/common_flags.json")) { throw "missing schemas/common_flags.json" }
          if (-not (Test-Path "$out/PySide6")) { throw "missing PySide6 folder" }

          $qwindows = Get-ChildItem $out -Recurse -Filter "qwindows.dll" | Select-Object -First 1
          if (-not $qwindows) {
            throw "missing qwindows.dll (Qt platform plugin) - workshop will not start"
          }
          Write-Host "Found qwindows.dll at:" $qwindows.FullName
          Write-Host "Workshop stage OK, files:" $fileCount

      - uses: actions/upload-artifact@v4
        with:
          name: workshop-bundle
          path: dist/workshop/
          if-no-files-found: error

  # ========== 组装 MO / YR 完整包 ==========
  pack:
    name: Pack MO + YR
    needs: [build-dll, build-launchers, build-editor, build-workshop]
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: engine
          path: bins/engine
      - uses: actions/download-artifact@v4
        with:
          name: launchers
          path: bins/launchers
      - uses: actions/download-artifact@v4
        with:
          name: editor-bundle
          path: bins/editor
      - uses: actions/download-artifact@v4
        with:
          name: workshop-bundle
          path: bins/workshop
      - name: Pack MO + YR editions
        shell: pwsh
        env:
          PYTHONIOENCODING: utf-8
          PYTHONUTF8: "1"
        run: |
          python scripts/pack_release.py
          if ($LASTEXITCODE -ne 0) { throw "pack_release.py failed" }
          cmd /c "dir /s /b AutoReloader-MO"
          cmd /c "dir /s /b AutoReloader-YR"

      - uses: actions/upload-artifact@v4
        with:
          name: AutoReloader-MO
          path: AutoReloader-MO/
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: AutoReloader-YR
          path: AutoReloader-YR/
          if-no-files-found: error

  # ========== 创建 GitHub Release ==========
  release:
    name: Create Release
    needs: [pack]
    runs-on: ubuntu-latest
    if: >
      github.event_name == 'push' ||
      (github.event_name == 'workflow_dispatch' && inputs.create_release == true)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: AutoReloader-MO
          path: AutoReloader-MO
      - uses: actions/download-artifact@v4
        with:
          name: AutoReloader-YR
          path: AutoReloader-YR
      - name: Zip packages
        run: |
          zip -r AutoReloader-MO.zip AutoReloader-MO
          zip -r AutoReloader-YR.zip AutoReloader-YR
          ls -lh *.zip
      - name: Determine tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            echo "tag=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          else
            TAG="${{ inputs.tag_name }}"
            if [ -z "$TAG" ]; then
              echo "tag_name is required when manually creating a release"
              exit 1
            fi
            echo "tag=$TAG" >> $GITHUB_OUTPUT
          fi
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: AutoReloader ${{ steps.tag.outputs.tag }}
          body: |
            ## AutoReloader ${{ steps.tag.outputs.tag }}

            ### 本版打包说明
            - 编辑器与工坊改为**各自独立的 standalone**，不再合并运行库，彻底避免 DLL/Qt 互相覆盖导致无法启动的问题。
            - 强制输出错误到 `INIEditor.err.txt` / `Workshop.err.txt`，启动失败时可直接查看。
            - CI 增加完整性检查（文件数量、PySide6、qwindows.dll）。

            ### 目录结构
            ```
            AutoReloader-MO/ 或 AutoReloader-YR/
              MOLauncher.exe / YRLauncher.exe
              AutoReloader.dll
              ReloaderConfig.ini
              README.txt
              Tools/
                editor/
                  INIEditor.exe
                  （完整运行时）
                workshop/
                  Workshop.exe
                  （完整运行时）
            ```

            ### 使用方法
            1. 把启动器 + DLL + ReloaderConfig.ini 放到游戏根目录
            2. 用本包启动器（管理员）启动游戏
            3. 运行 `Tools\editor\INIEditor.exe` 或 `Tools\workshop\Workshop.exe`
            4. 如启动失败，查看同目录下的 `.err.txt` 文件
          files: |
            AutoReloader-MO.zip
            AutoReloader-YR.zip
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
