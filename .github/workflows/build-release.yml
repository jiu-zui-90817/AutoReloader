# 发布工作流：引擎 + 启动器 + 编辑器 + 工坊 → MO/YR 包（PyInstaller 备份）
# 触发：仅手动。正式 Nuitka 包请用 Build Nuitka Release / tag v*-nuitka
name: Build Release (PyInstaller backup)

on:
  workflow_dispatch:
    inputs:
      create_release:
        description: "构建完成后创建 GitHub Release 并上传压缩包"
        type: boolean
        default: false
      tag_name:
        description: "Release 使用的 tag（手动运行时如需发版再填）"
        type: string
        default: ""

concurrency:
  group: release-pyinstaller-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

env:
  PYTHON_VERSION: "3.12"

jobs:
  build-dll:
    name: AutoReloader.dll
    runs-on: windows-2022
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x86
      - name: Clone YRpp
        run: |
          if (-not (Test-Path Backend/YRpp/.git)) {
            git clone --depth 1 https://github.com/Phobos-developers/YRpp.git Backend/YRpp
          }
      - name: Configure & Build
        working-directory: Backend
        run: |
          $built = $false
          cmake -B build -G "Visual Studio 17 2022" -A Win32
          if ($LASTEXITCODE -eq 0) {
            cmake --build build --config Release -- /m
            if ($LASTEXITCODE -eq 0) { $built = $true }
          }
          if (-not $built) {
            if (-not (Get-Command ninja -ErrorAction SilentlyContinue)) { choco install ninja -y --no-progress }
            if (Test-Path build) { Remove-Item -Recurse -Force build }
            cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
            if ($LASTEXITCODE -ne 0) { throw "cmake configure failed" }
            cmake --build build --parallel
            if ($LASTEXITCODE -ne 0) { throw "cmake build failed" }
          }
      - name: Collect
        run: |
          $dll = Get-ChildItem Backend -Recurse -Filter AutoReloader.dll | Select-Object -First 1
          if (-not $dll) { throw "AutoReloader.dll not found" }
          New-Item -ItemType Directory -Force -Path dist/engine | Out-Null
          Copy-Item $dll.FullName dist/engine/AutoReloader.dll
          if (Test-Path Config/ReloaderConfig.ini) { Copy-Item Config/ReloaderConfig.ini dist/engine/ }
      - uses: actions/upload-artifact@v4
        with:
          name: engine
          path: dist/engine/
          if-no-files-found: error

  build-launchers:
    name: Launchers
    runs-on: windows-2022
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x86
      - name: Build
        run: |
          New-Item -ItemType Directory -Force -Path dist/launchers | Out-Null
          cl /nologo /EHsc /O2 /Fe:"dist/launchers/MOLauncher.exe" Launcher/MOInjector.cpp user32.lib advapi32.lib shell32.lib /link /MANIFEST:EMBED /MANIFESTINPUT:"Launcher/app.manifest" /MANIFESTUAC:NO
          if ($LASTEXITCODE -ne 0) { throw "MO launcher failed" }
          cl /nologo /EHsc /O2 /Fe:"dist/launchers/YRLauncher.exe" Launcher/YRInjector.cpp user32.lib advapi32.lib shell32.lib gdi32.lib comctl32.lib /link /SUBSYSTEM:WINDOWS /MANIFEST:EMBED /MANIFESTINPUT:"Launcher/app.manifest" /MANIFESTUAC:NO
          if ($LASTEXITCODE -ne 0) { throw "YR launcher failed" }
      - uses: actions/upload-artifact@v4
        with:
          name: launchers
          path: dist/launchers/
          if-no-files-found: error

  build-editor:
    name: Editor
    runs-on: windows-2022
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: Frontend/editor/requirements.txt
      - name: Prepare
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path Frontend/editor/schemas | Out-Null
          Copy-Item -Force shared/schemas/common_flags.json Frontend/editor/schemas/common_flags.json
          if (-not (Test-Path Frontend/editor/config.json)) { throw "config.json missing" }
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r Frontend/editor/requirements.txt "pyinstaller>=6.3"
      - name: PyInstaller slim (windowed, _internal)
        working-directory: Frontend/editor
        shell: pwsh
        run: |
          $icon = @()
          if (Test-Path ../../assets/editor.ico) { $icon = @("--icon=../../assets/editor.ico") }
          $ex = @(
            "PySide6.QtWebEngine","PySide6.QtWebEngineCore","PySide6.QtWebEngineWidgets","PySide6.QtWebEngineQuick",
            "PySide6.QtWebChannel","PySide6.QtQml","PySide6.QtQuick","PySide6.QtQuickWidgets","PySide6.QtQuick3D",
            "PySide6.QtMultimedia","PySide6.QtMultimediaWidgets","PySide6.Qt3DCore","PySide6.Qt3DRender",
            "PySide6.QtCharts","PySide6.QtDataVisualization","PySide6.QtPdf","PySide6.QtPdfWidgets",
            "PySide6.QtBluetooth","PySide6.QtNfc","PySide6.QtPositioning","PySide6.QtLocation",
            "PySide6.QtSensors","PySide6.QtSerialPort","PySide6.QtTest","PySide6.QtDesigner","PySide6.QtHelp",
            "PySide6.QtSql","PySide6.QtHttpServer","PySide6.QtWebSockets","PySide6.QtWebView",
            "matplotlib","numpy","pandas","scipy","tkinter","unittest","test"
          )
          $exArgs = $ex | ForEach-Object { "--exclude-module"; $_ }
          python -m PyInstaller --noconfirm --clean --onedir --windowed --name INIEditor `
            --collect-binaries PySide6 --collect-binaries shiboken6 `
            @exArgs `
            --hidden-import=paths --hidden-import=core --hidden-import=core.project `
            --hidden-import=core.ini_parser --hidden-import=core.csf_parser --hidden-import=core.linter `
            --hidden-import=core.save_util --hidden-import=core.dependency_view --hidden-import=core.section_diff `
            --hidden-import=core.project_index --hidden-import=ui --hidden-import=ui.main_window `
            --hidden-import=ui.ini_highlighter --hidden-import=ui.debug_window `
            --add-data "config.json;." --add-data "schemas;schemas" @icon main.py
          if ($LASTEXITCODE -ne 0) { throw "PyInstaller editor failed" }
      - name: Stage + slim + Chinese name
        shell: pwsh
        run: |
          $src = "Frontend/editor/dist/INIEditor"
          if (-not (Test-Path "$src/INIEditor.exe")) { throw "missing INIEditor.exe" }
          $out = "dist/editor"
          Remove-Item -Recurse -Force $out -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          Copy-Item -Path (Join-Path $src "*") -Destination $out -Recurse -Force
          Copy-Item -Force Frontend/editor/config.json "$out/config.json"
          if (Test-Path "assets/editor.ico") { Copy-Item -Force "assets/editor.ico" "$out/editor.ico" }
          New-Item -ItemType Directory -Force -Path "$out/schemas" | Out-Null
          Copy-Item -Force shared/schemas/common_flags.json "$out/schemas/common_flags.json"
          $keep = @("platforms","styles","imageformats","iconengines")
          Get-ChildItem $out -Recurse -Directory -ErrorAction SilentlyContinue | Where-Object { $_.Name -match '^(translations|qml|QtWebEngine|resources)$' } | ForEach-Object { Remove-Item -Recurse -Force $_.FullName -ErrorAction SilentlyContinue }
          Get-ChildItem $out -Recurse -Directory -ErrorAction SilentlyContinue | Where-Object { $_.Name -in @("plugins","qt-plugins") } | ForEach-Object {
            Get-ChildItem $_.FullName -Directory -ErrorAction SilentlyContinue | ForEach-Object {
              if ($keep -notcontains $_.Name) { Remove-Item -Recurse -Force $_.FullName -ErrorAction SilentlyContinue }
            }
          }
          foreach ($pat in @("*WebEngine*","*Qt6Quick*","*Qt6Qml*","*Qt6Multimedia*","*Qt6Pdf*","*Qt63D*","*Qt6Charts*","*Qt6Sql*","opengl32sw.dll","*Qt6Designer*","*Qt6Help*","*Qt6Test*")) {
            Get-ChildItem $out -Recurse -File -Filter $pat -ErrorAction SilentlyContinue | ForEach-Object { Remove-Item -Force $_.FullName -ErrorAction SilentlyContinue }
          }
          $mb = [math]::Round(((Get-ChildItem $out -Recurse -File | Measure-Object Length -Sum).Sum/1MB),1)
          Write-Host "Editor size after slim: $mb MB"
          $qwin = Get-ChildItem $out -Recurse -Filter "qwindows.dll" | Select-Object -First 1
          if (-not $qwin) { throw "missing qwindows.dll" }
          $outFull = (Resolve-Path $out).Path
          $pluginsParent = $qwin.Directory.Parent.FullName
          $prefix = "."
          $pluginsRel = "PySide6/plugins"
          $norm = $pluginsParent.Replace([char]0x5C, '/')
          $outNorm = $outFull.Replace([char]0x5C, '/')
          $marker = "/_internal/"
          $mi = $norm.ToLower().IndexOf($marker)
          if ($mi -ge 0) {
            $prefix = "_internal"
            $after = $norm.Substring($mi + $marker.Length).TrimStart([char]0x2F)
            if ($after.Length -gt 0) { $pluginsRel = $after }
          } else {
            $rel = $norm
            if ($rel.StartsWith($outNorm)) { $rel = $rel.Substring($outNorm.Length) }
            $rel = $rel.TrimStart([char]0x2F)
            if ($rel.Length -gt 0) { $pluginsRel = $rel }
          }
          Write-Host "qt.conf Prefix=$prefix Plugins=$pluginsRel"
          Set-Content -Encoding ASCII -Path "$out/qt.conf" -Value "[Paths]`nPrefix = $prefix`nPlugins = $pluginsRel`n"
          if (Test-Path "$out/_internal") {
            Set-Content -Encoding ASCII -Path "$out/_internal/qt.conf" -Value "[Paths]`nPrefix = .`nPlugins = $pluginsRel`n"
          }
          $cn = Join-Path $out "INI工程编辑器.exe"
          if (Test-Path "$out/INIEditor.exe") { Move-Item -Force "$out/INIEditor.exe" $cn }
          Write-Host "Top-level:" (Get-ChildItem $out -File | Select-Object -ExpandProperty Name)
      - uses: actions/upload-artifact@v4
        with:
          name: editor-bundle
          path: dist/editor/
          if-no-files-found: error

  build-workshop:
    name: Workshop
    runs-on: windows-2022
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: Frontend/workshop/requirements.txt
      - name: Prepare
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path Frontend/workshop/schemas | Out-Null
          Copy-Item -Force shared/schemas/common_flags.json Frontend/workshop/schemas/common_flags.json
          $good = "https://raw.githubusercontent.com/jiu-zui-90817/AutoReloader/f4819a9e516f99bcd262e79f60cbdf77d82219e9/Frontend/workshop/app.py"
          Invoke-WebRequest -Uri $good -OutFile "Frontend/workshop/app.py" -UseBasicParsing
          python scripts/patch_workshop_icon.py
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r Frontend/workshop/requirements.txt "pyinstaller>=6.3"
      - name: PyInstaller slim (windowed, _internal)
        shell: pwsh
        run: |
          $env:PYTHONPATH = (Resolve-Path .).Path
          Push-Location Frontend/workshop
          $icon = @()
          if (Test-Path ../../assets/workshop.ico) { $icon = @("--icon=../../assets/workshop.ico") }
          $ex = @(
            "PySide6.QtWebEngineCore","PySide6.QtWebEngineWidgets","PySide6.QtQml","PySide6.QtQuick",
            "PySide6.QtMultimedia","PySide6.Qt3DCore","PySide6.QtCharts","PySide6.QtPdf",
            "PySide6.QtTest","PySide6.QtDesigner","PySide6.QtSql","matplotlib","numpy","tkinter"
          )
          $exArgs = $ex | ForEach-Object { "--exclude-module"; $_ }
          python -m PyInstaller --noconfirm --clean --onedir --windowed --name Workshop `
            --collect-binaries PySide6 --collect-binaries shiboken6 `
            @exArgs --hidden-import=app --hidden-import=fields --hidden-import=shared --paths=../.. `
            --add-data "schemas;schemas" --add-data "../../shared/profiles.json;." @icon main.py
          $code = $LASTEXITCODE
          Pop-Location
          if ($code -ne 0) { throw "PyInstaller workshop failed" }
      - name: Stage + slim + Chinese name
        shell: pwsh
        run: |
          $src = "Frontend/workshop/dist/Workshop"
          if (-not (Test-Path "$src/Workshop.exe")) { throw "missing Workshop.exe" }
          $out = "dist/workshop"
          Remove-Item -Recurse -Force $out -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          Copy-Item -Path (Join-Path $src "*") -Destination $out -Recurse -Force
          Copy-Item -Force shared/profiles.json "$out/profiles.json"
          if (Test-Path "assets/workshop.ico") { Copy-Item -Force "assets/workshop.ico" "$out/workshop.ico" }
          New-Item -ItemType Directory -Force -Path "$out/schemas" | Out-Null
          Copy-Item -Force shared/schemas/common_flags.json "$out/schemas/common_flags.json"
          $keep = @("platforms","styles","imageformats","iconengines")
          Get-ChildItem $out -Recurse -Directory -ErrorAction SilentlyContinue | Where-Object { $_.Name -match '^(translations|qml|QtWebEngine|resources)$' } | ForEach-Object { Remove-Item -Recurse -Force $_.FullName -ErrorAction SilentlyContinue }
          Get-ChildItem $out -Recurse -Directory -ErrorAction SilentlyContinue | Where-Object { $_.Name -in @("plugins","qt-plugins") } | ForEach-Object {
            Get-ChildItem $_.FullName -Directory -ErrorAction SilentlyContinue | ForEach-Object {
              if ($keep -notcontains $_.Name) { Remove-Item -Recurse -Force $_.FullName -ErrorAction SilentlyContinue }
            }
          }
          foreach ($pat in @("*WebEngine*","*Qt6Quick*","*Qt6Qml*","*Qt6Multimedia*","*Qt6Pdf*","*Qt63D*","*Qt6Charts*","opengl32sw.dll")) {
            Get-ChildItem $out -Recurse -File -Filter $pat -ErrorAction SilentlyContinue | ForEach-Object { Remove-Item -Force $_.FullName -ErrorAction SilentlyContinue }
          }
          $mb = [math]::Round(((Get-ChildItem $out -Recurse -File | Measure-Object Length -Sum).Sum/1MB),1)
          Write-Host "Workshop size after slim: $mb MB"
          $qwin = Get-ChildItem $out -Recurse -Filter "qwindows.dll" | Select-Object -First 1
          if (-not $qwin) { throw "missing qwindows.dll" }
          $outFull = (Resolve-Path $out).Path
          $pluginsParent = $qwin.Directory.Parent.FullName
          $prefix = "."
          $pluginsRel = "PySide6/plugins"
          $norm = $pluginsParent.Replace([char]0x5C, '/')
          $outNorm = $outFull.Replace([char]0x5C, '/')
          $marker = "/_internal/"
          $mi = $norm.ToLower().IndexOf($marker)
          if ($mi -ge 0) {
            $prefix = "_internal"
            $after = $norm.Substring($mi + $marker.Length).TrimStart([char]0x2F)
            if ($after.Length -gt 0) { $pluginsRel = $after }
          } else {
            $rel = $norm
            if ($rel.StartsWith($outNorm)) { $rel = $rel.Substring($outNorm.Length) }
            $rel = $rel.TrimStart([char]0x2F)
            if ($rel.Length -gt 0) { $pluginsRel = $rel }
          }
          Write-Host "qt.conf Prefix=$prefix Plugins=$pluginsRel"
          Set-Content -Encoding ASCII -Path "$out/qt.conf" -Value "[Paths]`nPrefix = $prefix`nPlugins = $pluginsRel`n"
          if (Test-Path "$out/_internal") {
            Set-Content -Encoding ASCII -Path "$out/_internal/qt.conf" -Value "[Paths]`nPrefix = .`nPlugins = $pluginsRel`n"
          }
          $cn = Join-Path $out "战术工坊.exe"
          if (Test-Path "$out/Workshop.exe") { Move-Item -Force "$out/Workshop.exe" $cn }
      - uses: actions/upload-artifact@v4
        with:
          name: workshop-bundle
          path: dist/workshop/
          if-no-files-found: error

  pack:
    name: Pack MO + YR
    needs: [build-dll, build-launchers, build-editor, build-workshop]
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: engine
          path: bins/engine
      - uses: actions/download-artifact@v4
        with:
          name: launchers
          path: bins/launchers
      - uses: actions/download-artifact@v4
        with:
          name: editor-bundle
          path: bins/editor
      - uses: actions/download-artifact@v4
        with:
          name: workshop-bundle
          path: bins/workshop
      - name: Pack
        shell: pwsh
        env:
          PYTHONIOENCODING: utf-8
          PYTHONUTF8: "1"
        run: |
          python scripts/pack_release.py
          if ($LASTEXITCODE -ne 0) { throw "pack_release.py failed" }
      - uses: actions/upload-artifact@v4
        with:
          name: AutoReloader-MO
          path: AutoReloader-MO/
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: AutoReloader-YR
          path: AutoReloader-YR/
          if-no-files-found: error

  release:
    name: Create GitHub Release
    needs: [pack]
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' && inputs.create_release == true
    steps:
      - name: Resolve tag
        id: tag
        shell: bash
        run: |
          TAG="${{ inputs.tag_name }}"
          if [[ -z "$TAG" ]]; then echo "need tag_name"; exit 1; fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v4
        with:
          name: AutoReloader-MO
          path: mo_pack
      - uses: actions/download-artifact@v4
        with:
          name: AutoReloader-YR
          path: yr_pack
      - name: Zip
        shell: bash
        run: |
          TAG="${{ steps.tag.outputs.tag }}"
          (cd mo_pack && zip -r -q "../AutoReloader-MO-${TAG}-pyinstaller.zip" .)
          (cd yr_pack && zip -r -q "../AutoReloader-YR-${TAG}-pyinstaller.zip" .)
      - name: Publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          TAG="${{ steps.tag.outputs.tag }}"
          NOTES="## PyInstaller 备份包\n- 体积较大；正式推荐 Nuitka 包\n"
          if gh release view "$TAG" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            echo "exists"
          else
            gh release create "$TAG" --repo "${{ github.repository }}" --title "AutoReloader ${TAG} (PyInstaller)" --notes "$NOTES" --target "${{ github.sha }}" || true
          fi
          gh release upload "$TAG" "AutoReloader-MO-${TAG}-pyinstaller.zip" "AutoReloader-YR-${TAG}-pyinstaller.zip" --repo "${{ github.repository }}" --clobber
