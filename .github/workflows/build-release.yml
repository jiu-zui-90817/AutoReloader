# 发布工作流：引擎 + 启动器 + 编辑器 + 工坊 → MO/YR 包
# 触发：
#   1. 推送版本 tag：git tag v1.2.0 && git push origin v1.2.0
#   2. Actions 页手动 Run workflow（可选勾选创建 Release）
name: Build Release

on:
  workflow_dispatch:
    inputs:
      create_release:
        description: "构建完成后创建 GitHub Release 并上传压缩包"
        type: boolean
        default: true
      tag_name:
        description: "Release 使用的 tag（手动运行时必填，如 v1.2.0；推送 tag 触发时可留空）"
        type: string
        default: ""
  push:
    tags:
      - "v*"

concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

env:
  PYTHON_VERSION: "3.12"

jobs:
  build-dll:
    name: AutoReloader.dll
    runs-on: windows-2022
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x86
      - name: Clone YRpp
        run: |
          if (-not (Test-Path Backend/YRpp/.git)) {
            git clone --depth 1 https://github.com/Phobos-developers/YRpp.git Backend/YRpp
          }
      - name: Configure & Build
        working-directory: Backend
        run: |
          $built = $false
          cmake -B build -G "Visual Studio 17 2022" -A Win32
          if ($LASTEXITCODE -eq 0) {
            cmake --build build --config Release -- /m
            if ($LASTEXITCODE -eq 0) { $built = $true }
          }
          if (-not $built) {
            if (-not (Get-Command ninja -ErrorAction SilentlyContinue)) {
              choco install ninja -y --no-progress
            }
            if (Test-Path build) { Remove-Item -Recurse -Force build }
            cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
            if ($LASTEXITCODE -ne 0) { throw "cmake configure failed" }
            cmake --build build --parallel
            if ($LASTEXITCODE -ne 0) { throw "cmake build failed" }
          }
      - name: Collect
        run: |
          $dll = Get-ChildItem Backend -Recurse -Filter AutoReloader.dll |
            Select-Object -First 1
          if (-not $dll) { throw "AutoReloader.dll not found" }
          New-Item -ItemType Directory -Force -Path dist/engine | Out-Null
          Copy-Item $dll.FullName dist/engine/AutoReloader.dll
          if (Test-Path Config/ReloaderConfig.ini) {
            Copy-Item Config/ReloaderConfig.ini dist/engine/
          }
      - uses: actions/upload-artifact@v4
        with:
          name: engine
          path: dist/engine/
          if-no-files-found: error

  build-launchers:
    name: Launchers
    runs-on: windows-2022
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x86
      - name: Build
        run: |
          New-Item -ItemType Directory -Force -Path dist/launchers | Out-Null
          cl /nologo /EHsc /O2 /Fe:"dist/launchers/MOLauncher.exe" Launcher/MOInjector.cpp user32.lib advapi32.lib shell32.lib /link /MANIFEST:EMBED /MANIFESTINPUT:"Launcher/app.manifest" /MANIFESTUAC:NO
          if ($LASTEXITCODE -ne 0) { throw "MO launcher failed" }
          cl /nologo /EHsc /O2 /Fe:"dist/launchers/YRLauncher.exe" Launcher/YRInjector.cpp user32.lib advapi32.lib shell32.lib gdi32.lib comctl32.lib /link /SUBSYSTEM:WINDOWS /MANIFEST:EMBED /MANIFESTINPUT:"Launcher/app.manifest" /MANIFESTUAC:NO
          if ($LASTEXITCODE -ne 0) { throw "YR launcher failed" }
          Get-ChildItem dist/launchers
      - uses: actions/upload-artifact@v4
        with:
          name: launchers
          path: dist/launchers/
          if-no-files-found: error

  build-editor:
    name: Editor
    runs-on: windows-2022
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: Frontend/editor/requirements.txt
      - name: Prepare resources
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path Frontend/editor/schemas | Out-Null
          Copy-Item -Force shared/schemas/common_flags.json Frontend/editor/schemas/common_flags.json
          if (-not (Test-Path Frontend/editor/config.json)) { throw "config.json missing" }
          if (-not (Test-Path Frontend/editor/schemas/common_flags.json)) { throw "schemas missing" }
          if (-not (Test-Path Frontend/editor/core/__init__.py)) { throw "core package missing" }
          if (-not (Test-Path Frontend/editor/ui/__init__.py)) { throw "ui package missing" }
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r Frontend/editor/requirements.txt "pyinstaller>=6.3"
          python -c "import PySide6, PyInstaller; print('PySide6', PySide6.__version__); print('PyInstaller', PyInstaller.__version__)"
      - name: PyInstaller onedir (console, flat contents)
        working-directory: Frontend/editor
        shell: pwsh
        run: |
          $icon = @()
          if (Test-Path ../../assets/editor.ico) { $icon = @("--icon=../../assets/editor.ico") }
          python -m PyInstaller `
            --noconfirm --clean `
            --onedir `
            --contents-directory=. `
            --name INIEditor `
            --console `
            --collect-all PySide6 `
            --collect-all shiboken6 `
            --hidden-import=paths `
            --hidden-import=core `
            --hidden-import=core.project `
            --hidden-import=core.ini_parser `
            --hidden-import=core.csf_parser `
            --hidden-import=core.linter `
            --hidden-import=core.save_util `
            --hidden-import=core.dependency_view `
            --hidden-import=core.section_diff `
            --hidden-import=core.project_index `
            --hidden-import=ui `
            --hidden-import=ui.main_window `
            --hidden-import=ui.ini_highlighter `
            --hidden-import=ui.debug_window `
            --add-data "config.json;." `
            --add-data "schemas;schemas" `
            @icon `
            main.py
          if ($LASTEXITCODE -ne 0) { throw "PyInstaller editor failed" }
      - name: Stage folder + integrity
        shell: pwsh
        run: |
          $src = "Frontend/editor/dist/INIEditor"
          if (-not (Test-Path "$src/INIEditor.exe")) { throw "missing $src/INIEditor.exe" }
          $out = "dist/editor"
          Remove-Item -Recurse -Force $out -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          Copy-Item -Path (Join-Path $src "*") -Destination $out -Recurse -Force
          Copy-Item -Force Frontend/editor/config.json "$out/config.json"
          New-Item -ItemType Directory -Force -Path "$out/schemas" | Out-Null
          Copy-Item -Force shared/schemas/common_flags.json "$out/schemas/common_flags.json"
          if (Test-Path Frontend/editor/使用说明.txt) { Copy-Item -Force Frontend/editor/使用说明.txt "$out/" }
          $qwin = Get-ChildItem $out -Recurse -Filter "qwindows.dll" | Select-Object -First 1
          if (-not $qwin) { throw "missing qwindows.dll — Qt platform plugin 未打进包" }
          Write-Host "qwindows.dll:" $qwin.FullName
          $pluginsRel = $qwin.Directory.Parent.FullName.Substring((Resolve-Path $out).Path.Length).TrimStart('\','/')
          if (-not $pluginsRel) { $pluginsRel = "PySide6/plugins" }
          $pluginRoot = $qwin.Directory.Parent.Name
          $pluginParent = $qwin.Directory.Parent.Parent
          if ($pluginParent -and (Test-Path $pluginParent)) {
            $candidate = Join-Path $pluginParent.FullName $pluginRoot
            if (Test-Path (Join-Path $candidate "platforms")) {
              $pluginsRel = $candidate.Substring((Resolve-Path $out).Path.Length).TrimStart('\','/').Replace('\','/')
            }
          }
          $pluginsRel = $pluginsRel.Replace('\','/')
          @"
          [Paths]
          Prefix = .
          Plugins = $pluginsRel
          "@ | Set-Content -Encoding ASCII "$out/qt.conf"
          Write-Host "qt.conf Plugins=$pluginsRel"
          @"
          @echo off
          chcp 65001 >nul
          cd /d "%~dp0"
          echo ===== INIEditor debug launcher =====
          echo CD=%CD%
          echo.
          dir /b INIEditor.exe 2>nul
          dir /b /s qwindows.dll 2>nul
          if exist qt.conf type qt.conf
          echo.
          set QT_DEBUG_PLUGINS=1
          INIEditor.exe
          echo.
          echo EXIT=%ERRORLEVEL%
          echo.
          if exist INIEditor_boot.log (
            echo ----- INIEditor_boot.log -----
            type INIEditor_boot.log
          ) else (
            echo NO INIEditor_boot.log in this folder
            if exist "%TEMP%\INIEditor_boot.log" (
              echo ----- %TEMP%\INIEditor_boot.log -----
              type "%TEMP%\INIEditor_boot.log"
            )
            if exist "%USERPROFILE%\Desktop\INIEditor_boot.log" (
              echo ----- Desktop boot log -----
              type "%USERPROFILE%\Desktop\INIEditor_boot.log"
            )
          )
          if exist INIEditor_crash.log (
            echo ----- INIEditor_crash.log -----
            type INIEditor_crash.log
          )
          pause
          "@ | Set-Content -Encoding ASCII "$out/运行编辑器-看报错.bat"
          $n = (Get-ChildItem $out -Recurse -File | Measure-Object).Count
          Write-Host "Editor files:" $n
          if ($n -lt 80) { throw "editor package too small ($n files)" }
          if (-not (Test-Path "$out/INIEditor.exe")) { throw "missing INIEditor.exe" }
          $pyd = Get-ChildItem $out -Recurse -Filter "python3*.dll" | Select-Object -First 1
          if (-not $pyd) {
            $pyd = Get-ChildItem $out -Recurse -Filter "python*.dll" | Select-Object -First 1
          }
          if (-not $pyd) { Write-Host "WARN: no python*.dll found (may be linked differently)" }
          else { Write-Host "python dll:" $pyd.FullName }
      - uses: actions/upload-artifact@v4
        with:
          name: editor-bundle
          path: dist/editor/
          if-no-files-found: error

  build-workshop:
    name: Workshop
    runs-on: windows-2022
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: Frontend/workshop/requirements.txt
      - name: Prepare resources
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path Frontend/workshop/schemas | Out-Null
          Copy-Item -Force shared/schemas/common_flags.json Frontend/workshop/schemas/common_flags.json
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r Frontend/workshop/requirements.txt "pyinstaller>=6.3"
      - name: PyInstaller onedir
        shell: pwsh
        run: |
          $env:PYTHONPATH = (Resolve-Path .).Path
          Push-Location Frontend/workshop
          $icon = @()
          if (Test-Path ../../assets/workshop.ico) { $icon = @("--icon=../../assets/workshop.ico") }
          python -m PyInstaller `
            --noconfirm --clean `
            --onedir `
            --contents-directory=. `
            --name Workshop `
            --console `
            --collect-all PySide6 `
            --collect-all shiboken6 `
            --hidden-import=app `
            --hidden-import=fields `
            --hidden-import=shared `
            --paths=../.. `
            --add-data "schemas;schemas" `
            --add-data "../../shared/profiles.json;." `
            @icon `
            main.py
          $code = $LASTEXITCODE
          Pop-Location
          if ($code -ne 0) { throw "PyInstaller workshop failed" }
      - name: Stage folder
        shell: pwsh
        run: |
          $src = "Frontend/workshop/dist/Workshop"
          if (-not (Test-Path "$src/Workshop.exe")) { throw "missing $src/Workshop.exe" }
          $out = "dist/workshop"
          Remove-Item -Recurse -Force $out -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          Copy-Item -Path (Join-Path $src "*") -Destination $out -Recurse -Force
          Copy-Item -Force shared/profiles.json "$out/profiles.json"
          New-Item -ItemType Directory -Force -Path "$out/schemas" | Out-Null
          Copy-Item -Force shared/schemas/common_flags.json "$out/schemas/common_flags.json"
          $qwin = Get-ChildItem $out -Recurse -Filter "qwindows.dll" | Select-Object -First 1
          if (-not $qwin) { throw "missing qwindows.dll in workshop" }
          $rel = $qwin.Directory.Parent.FullName.Replace((Resolve-Path $out).Path, "").TrimStart('\').Replace('\','/')
          if (-not $rel) { $rel = "PySide6/plugins" }
          @"
          [Paths]
          Prefix = .
          Plugins = $rel
          "@ | Set-Content -Encoding ASCII "$out/qt.conf"
          if (-not (Test-Path "$out/Workshop.exe")) { throw "missing Workshop.exe" }
          Write-Host "OK workshop files:" (Get-ChildItem $out -Recurse -File | Measure-Object).Count
      - uses: actions/upload-artifact@v4
        with:
          name: workshop-bundle
          path: dist/workshop/
          if-no-files-found: error

  build-editor-nuitka:
    name: Editor (Nuitka)
    runs-on: windows-2022
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: Frontend/editor/requirements.txt
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - name: Prepare resources
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path Frontend/editor/schemas | Out-Null
          Copy-Item -Force shared/schemas/common_flags.json Frontend/editor/schemas/common_flags.json
          if (-not (Test-Path Frontend/editor/config.json)) { throw "config.json missing" }
          if (-not (Test-Path Frontend/editor/core/__init__.py)) { throw "core package missing" }
          if (-not (Test-Path Frontend/editor/ui/__init__.py)) { throw "ui package missing" }
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r Frontend/editor/requirements.txt nuitka ordered-set zstandard
          python -c "import PySide6, nuitka; print('PySide6', PySide6.__version__)"
      - name: Nuitka standalone (editor)
        working-directory: Frontend/editor
        shell: pwsh
        run: |
          $iconArgs = @()
          if (Test-Path ../../assets/editor.ico) {
            $iconArgs += "--windows-icon-from-ico=../../assets/editor.ico"
          }
          python -m nuitka `
            --standalone `
            --windows-console-mode=force `
            --force-stdout-spec=INIEditor.out.txt `
            --force-stderr-spec=INIEditor.err.txt `
            --enable-plugin=pyside6 `
            --assume-yes-for-downloads `
            --msvc=latest `
            @iconArgs `
            --output-dir=../../build/editor-nuitka `
            --output-filename=INIEditor.exe `
            --include-data-files=config.json=config.json `
            --include-data-dir=schemas=schemas `
            --include-module=paths `
            --include-package=core `
            --include-package=ui `
            --nofollow-import-to=tkinter `
            --nofollow-import-to=PySide6.QtWebEngineCore `
            --nofollow-import-to=PySide6.QtWebEngineWidgets `
            --nofollow-import-to=PySide6.QtWebEngineQuick `
            --nofollow-import-to=PySide6.QtWebChannel `
            --nofollow-import-to=PySide6.QtQml `
            --nofollow-import-to=PySide6.QtQuick `
            --nofollow-import-to=PySide6.QtQuickWidgets `
            --nofollow-import-to=PySide6.QtMultimedia `
            --nofollow-import-to=PySide6.QtMultimediaWidgets `
            --nofollow-import-to=PySide6.Qt3DCore `
            --nofollow-import-to=PySide6.QtCharts `
            --nofollow-import-to=PySide6.QtDataVisualization `
            --nofollow-import-to=PySide6.QtPdf `
            --nofollow-import-to=PySide6.QtPdfWidgets `
            --nofollow-import-to=PySide6.QtBluetooth `
            --nofollow-import-to=PySide6.QtNfc `
            --nofollow-import-to=PySide6.QtPositioning `
            --nofollow-import-to=PySide6.QtLocation `
            --nofollow-import-to=PySide6.QtSensors `
            --nofollow-import-to=PySide6.QtSerialPort `
            --nofollow-import-to=PySide6.QtTest `
            --nofollow-import-to=PySide6.QtDesigner `
            --nofollow-import-to=PySide6.QtHelp `
            --remove-output `
            main.py
          if ($LASTEXITCODE -ne 0) { throw "Nuitka editor failed" }
      - name: Stage Nuitka editor
        shell: pwsh
        run: |
          $out = "dist/editor-nuitka"
          Remove-Item -Recurse -Force $out -ErrorAction SilentlyContinue
          $dist = Get-ChildItem -Path build/editor-nuitka -Directory -Filter "*.dist" | Select-Object -First 1
          if (-not $dist) { throw "editor-nuitka .dist not found" }
          Write-Host "Using:" $dist.FullName
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          Copy-Item -Path (Join-Path $dist.FullName "*") -Destination $out -Recurse -Force
          $exe = Get-ChildItem $out -Filter "*.exe" | Select-Object -First 1
          if (-not $exe) { throw "no exe in editor-nuitka dist" }
          if ($exe.Name -ne "INIEditor.exe") {
            Move-Item -Force $exe.FullName (Join-Path $out "INIEditor.exe")
          }
          Copy-Item -Force Frontend/editor/config.json "$out/config.json"
          New-Item -ItemType Directory -Force -Path "$out/schemas" | Out-Null
          Copy-Item -Force shared/schemas/common_flags.json "$out/schemas/common_flags.json"
          if (Test-Path Frontend/editor/使用说明.txt) {
            Copy-Item -Force Frontend/editor/使用说明.txt "$out/"
          }
          $qwin = Get-ChildItem $out -Recurse -Filter "qwindows.dll" | Select-Object -First 1
          if (-not $qwin) { throw "missing qwindows.dll in Nuitka editor" }
          Write-Host "qwindows.dll:" $qwin.FullName
          $pluginsRel = "PySide6/plugins"
          try {
            $rel = $qwin.Directory.Parent.FullName.Replace((Resolve-Path $out).Path, "").TrimStart('\').Replace('\','/')
            if ($rel) { $pluginsRel = $rel }
          } catch {}
          @"
          [Paths]
          Prefix = .
          Plugins = $pluginsRel
          "@ | Set-Content -Encoding ASCII "$out/qt.conf"
          @"
          @echo off
          chcp 65001 >nul
          cd /d "%~dp0"
          echo ===== INIEditor Nuitka debug =====
          echo CD=%CD%
          dir /b INIEditor.exe 2>nul
          dir /b /s qwindows.dll 2>nul
          if exist qt.conf type qt.conf
          echo.
          set QT_DEBUG_PLUGINS=1
          INIEditor.exe
          echo EXIT=%ERRORLEVEL%
          if exist INIEditor_boot.log type INIEditor_boot.log
          if exist INIEditor.err.txt type INIEditor.err.txt
          if exist INIEditor.out.txt type INIEditor.out.txt
          if exist INIEditor_crash.log type INIEditor_crash.log
          if exist "%TEMP%\INIEditor_boot.log" type "%TEMP%\INIEditor_boot.log"
          pause
          "@ | Set-Content -Encoding ASCII "$out/运行编辑器-看报错.bat"
          $n = (Get-ChildItem $out -Recurse -File | Measure-Object).Count
          Write-Host "Nuitka editor files:" $n
          if ($n -lt 50) { throw "Nuitka editor package too small ($n files)" }
          if (-not (Test-Path "$out/INIEditor.exe")) { throw "missing INIEditor.exe" }
      - uses: actions/upload-artifact@v4
        with:
          name: editor-nuitka-bundle
          path: dist/editor-nuitka/
          if-no-files-found: error

  build-workshop-nuitka:
    name: Workshop (Nuitka)
    runs-on: windows-2022
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: Frontend/workshop/requirements.txt
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - name: Prepare resources
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path Frontend/workshop/schemas | Out-Null
          Copy-Item -Force shared/schemas/common_flags.json Frontend/workshop/schemas/common_flags.json
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r Frontend/workshop/requirements.txt nuitka ordered-set zstandard
      - name: Nuitka standalone (workshop)
        shell: pwsh
        run: |
          $env:PYTHONPATH = (Resolve-Path .).Path
          Push-Location Frontend/workshop
          $iconArgs = @()
          if (Test-Path ../../assets/workshop.ico) {
            $iconArgs += "--windows-icon-from-ico=../../assets/workshop.ico"
          }
          python -m nuitka `
            --standalone `
            --windows-console-mode=force `
            --force-stdout-spec=Workshop.out.txt `
            --force-stderr-spec=Workshop.err.txt `
            --enable-plugin=pyside6 `
            --assume-yes-for-downloads `
            --msvc=latest `
            @iconArgs `
            --output-dir=../../build/workshop-nuitka `
            --output-filename=Workshop.exe `
            --include-package=shared `
            --include-module=app `
            --include-module=fields `
            --include-data-files=../../shared/profiles.json=profiles.json `
            --include-data-dir=schemas=schemas `
            --nofollow-import-to=tkinter `
            --nofollow-import-to=PySide6.QtWebEngineCore `
            --nofollow-import-to=PySide6.QtWebEngineWidgets `
            --nofollow-import-to=PySide6.QtWebEngineQuick `
            --nofollow-import-to=PySide6.QtQml `
            --nofollow-import-to=PySide6.QtQuick `
            --nofollow-import-to=PySide6.QtMultimedia `
            --nofollow-import-to=PySide6.Qt3DCore `
            --nofollow-import-to=PySide6.QtCharts `
            --nofollow-import-to=PySide6.QtPdf `
            --nofollow-import-to=PySide6.QtDesigner `
            --nofollow-import-to=PySide6.QtTest `
            --remove-output `
            main.py
          $code = $LASTEXITCODE
          Pop-Location
          if ($code -ne 0) { throw "Nuitka workshop failed" }
      - name: Stage Nuitka workshop
        shell: pwsh
        run: |
          $out = "dist/workshop-nuitka"
          Remove-Item -Recurse -Force $out -ErrorAction SilentlyContinue
          $dist = Get-ChildItem -Path build/workshop-nuitka -Directory -Filter "*.dist" | Select-Object -First 1
          if (-not $dist) { throw "workshop-nuitka .dist not found" }
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          Copy-Item -Path (Join-Path $dist.FullName "*") -Destination $out -Recurse -Force
          $exe = Get-ChildItem $out -Filter "*.exe" | Select-Object -First 1
          if (-not $exe) { throw "no exe in workshop-nuitka dist" }
          if ($exe.Name -ne "Workshop.exe") {
            Move-Item -Force $exe.FullName (Join-Path $out "Workshop.exe")
          }
          Copy-Item -Force shared/profiles.json "$out/profiles.json"
          New-Item -ItemType Directory -Force -Path "$out/schemas" | Out-Null
          Copy-Item -Force shared/schemas/common_flags.json "$out/schemas/common_flags.json"
          $qwin = Get-ChildItem $out -Recurse -Filter "qwindows.dll" | Select-Object -First 1
          if (-not $qwin) { throw "missing qwindows.dll in Nuitka workshop" }
          $rel = "PySide6/plugins"
          try {
            $r = $qwin.Directory.Parent.FullName.Replace((Resolve-Path $out).Path, "").TrimStart('\').Replace('\','/')
            if ($r) { $rel = $r }
          } catch {}
          @"
          [Paths]
          Prefix = .
          Plugins = $rel
          "@ | Set-Content -Encoding ASCII "$out/qt.conf"
          $n = (Get-ChildItem $out -Recurse -File | Measure-Object).Count
          Write-Host "Nuitka workshop files:" $n
          if ($n -lt 40) { throw "Nuitka workshop package too small ($n files)" }
          if (-not (Test-Path "$out/Workshop.exe")) { throw "missing Workshop.exe" }
      - uses: actions/upload-artifact@v4
        with:
          name: workshop-nuitka-bundle
          path: dist/workshop-nuitka/
          if-no-files-found: error

  pack:
    name: Pack MO + YR
    needs: [build-dll, build-launchers, build-editor, build-workshop]
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: engine
          path: bins/engine
      - uses: actions/download-artifact@v4
        with:
          name: launchers
          path: bins/launchers
      - uses: actions/download-artifact@v4
        with:
          name: editor-bundle
          path: bins/editor
      - uses: actions/download-artifact@v4
        with:
          name: workshop-bundle
          path: bins/workshop
      - name: Pack MO + YR editions
        shell: pwsh
        env:
          PYTHONIOENCODING: utf-8
          PYTHONUTF8: "1"
        run: |
          python scripts/pack_release.py
          if ($LASTEXITCODE -ne 0) { throw "pack_release.py failed" }
          cmd /c "dir /s /b AutoReloader-MO"
          cmd /c "dir /s /b AutoReloader-YR"
      - uses: actions/upload-artifact@v4
        with:
          name: AutoReloader-MO
          path: AutoReloader-MO/
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: AutoReloader-YR
          path: AutoReloader-YR/
          if-no-files-found: error

  release:
    name: Create GitHub Release
    needs: [pack]
    runs-on: ubuntu-latest
    if: >
      startsWith(github.ref, 'refs/tags/v') ||
      (github.event_name == 'workflow_dispatch' && inputs.create_release == true)
    steps:
      - name: Resolve tag name
        id: tag
        shell: bash
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
          else
            TAG="${{ inputs.tag_name }}"
          fi
          if [[ -z "$TAG" ]]; then
            echo "手动发布时请填写 tag_name（例如 v1.2.0）"
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Using tag: $TAG"
      - uses: actions/download-artifact@v4
        with:
          name: AutoReloader-MO
          path: mo_pack
      - uses: actions/download-artifact@v4
        with:
          name: AutoReloader-YR
          path: yr_pack
      - name: Zip packages (ASCII filenames)
        shell: bash
        run: |
          set -euo pipefail
          TAG="${{ steps.tag.outputs.tag }}"
          (cd mo_pack && zip -r -q "../AutoReloader-MO-${TAG}.zip" .)
          (cd yr_pack && zip -r -q "../AutoReloader-YR-${TAG}.zip" .)
          ls -la AutoReloader-*-"${TAG}".zip
      - name: Publish Release with gh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="${{ steps.tag.outputs.tag }}"
          TITLE="AutoReloader ${TAG}"
          NOTES="## 打包说明\n- 正式包：PyInstaller onedir\n- 另有可选 Nuitka artifact：editor-nuitka-bundle / workshop-nuitka-bundle\n- 失败请先双击 运行编辑器-看报错.bat\n- 整夹保留，不要只拷贝 exe\n"
          if gh release view "$TAG" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            echo "Release $TAG already exists, upload/overwrite assets"
          else
            gh release create "$TAG" \
              --repo "${{ github.repository }}" \
              --title "$TITLE" \
              --notes "$NOTES" \
              --verify-tag || \
            gh release create "$TAG" \
              --repo "${{ github.repository }}" \
              --title "$TITLE" \
              --notes "$NOTES" \
              --target "${{ github.sha }}"
          fi
          gh release upload "$TAG" \
            "AutoReloader-MO-${TAG}.zip" \
            "AutoReloader-YR-${TAG}.zip" \
            --repo "${{ github.repository }}" \
            --clobber
          gh release view "$TAG" --repo "${{ github.repository }}"
