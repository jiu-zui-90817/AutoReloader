name: Build DLL

on:
  push:
    branches:
      - main
      - "engine/**"
    paths:
      - "Backend/**"
      - "Launcher/**"
      - "Config/**"
      - ".github/workflows/build-dll.yml"
  pull_request:
    paths:
      - "Backend/**"
      - "Launcher/**"
      - ".github/workflows/build-dll.yml"
  workflow_dispatch:

jobs:
  build-dll:
    name: AutoReloader.dll (x86)
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x86
      - name: Clone YRpp
        shell: pwsh
        run: |
          if (-not (Test-Path Backend/YRpp/.git)) {
            git clone --depth 1 https://github.com/Phobos-developers/YRpp.git Backend/YRpp
          }
      - name: Configure & build
        working-directory: Backend
        shell: pwsh
        run: |
          cmake -B build -G "Visual Studio 17 2022" -A Win32
          if ($LASTEXITCODE -ne 0) { throw "cmake configure failed" }
          cmake --build build --config Release -- /m
          if ($LASTEXITCODE -ne 0) { throw "cmake build failed" }
      - name: Compile launchers
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path build-launchers | Out-Null
          cl /nologo /EHsc /O2 /Fe:"build-launchers/MOLauncher.exe" Launcher/MOInjector.cpp user32.lib advapi32.lib shell32.lib version.lib /link /MANIFEST:EMBED /MANIFESTINPUT:"Launcher/app.manifest" /MANIFESTUAC:NO
          if ($LASTEXITCODE -ne 0) { throw "MOLauncher build failed" }
          cl /nologo /EHsc /O2 /Fe:"build-launchers/YRLauncher.exe" Launcher/YRInjector.cpp user32.lib advapi32.lib shell32.lib version.lib gdi32.lib comctl32.lib /link /SUBSYSTEM:WINDOWS /MANIFEST:EMBED /MANIFESTINPUT:"Launcher/app.manifest" /MANIFESTUAC:NO
          if ($LASTEXITCODE -ne 0) { throw "YRLauncher build failed" }
      - name: Verify artifact
        shell: pwsh
        run: |
          $dll = Get-ChildItem Backend -Recurse -Filter AutoReloader.dll |
            Where-Object { $_.FullName -match 'Release' } |
            Select-Object -First 1
          if (-not $dll) { throw "AutoReloader.dll not found" }
          Write-Host "Built: $($dll.FullName) ($($dll.Length) bytes)"
      - uses: actions/upload-artifact@v4
        with:
          name: AutoReloader-dll
          path: Backend/build/bin/Release/AutoReloader.dll
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: AutoReloader-launchers
          path: build-launchers/*.exe
          if-no-files-found: error
