[Settings]
; 自动监控开关。true: 保存目标 INI 文件即刻在游戏内生效；false: 需手动按热键触发
AutoMonitor=true

; 手动重载触发热键。默认 116 代表 F5 键 (采用 Windows 虚拟键码)
HotKey=116

; 调试控制台开关。true: 显示终端黑框以查看注入日志；false: 隐藏黑框
; 即使隐藏，也会在游戏目录写入 Reloader_Log.txt
ShowConsole=false

; 重载成功时的提示音
Beep=true

; 仅在游戏窗口处于前台时响应热键（避免在浏览器里按 F5 触发重载）
HotkeyOnlyInGame=true

; 自动监控轮询间隔（毫秒），100-5000
PollIntervalMs=500

; 目标监控文件列表。支持监控多个文件，用英文逗号分隔即可。这些文件需放在游戏根目录。
TargetINI=hotfix.ini,

[Logging]
; 是否写 Reloader_Log.txt（游戏目录）
LogFile=true

; 日志轮转大小（KB），超过后改名为 Reloader_Log.txt.1
LogMaxKB=1024

[Extensions]
; 允许 hotfix 的 [AutoReloader] 节执行运行时动作（需要 Phobos）
; LiveConvert 控制 Convert=；AE / 变量指令写入后即执行，不需要时可从 hotfix 删除
; 可用的 hotfix 指令：
;   Convert=M60>MTNK                     实时转换已放置单位类型
;   AttachAE=M60:AE_NAME                 给所有 M60 附加 AttachEffect
;   DetachAE=M60:AE_NAME                 移除指定 AttachEffect
;   DetachAEGroup=M60:GROUP_NAME         按组移除 AttachEffect
;   ReplaceAE=M60:OLD_AE>NEW_AE          先移除旧 AE，再附加新 AE
;   ReplaceAEGroup=M60:GROUP_NAME>NEW_AE 按组移除后附加新 AE
;   SetLocalVar=5=1                      设置场景局部变量（triggers）
;   SetGlobalVar=10=1                    设置全局变量（战役/跨地图）
LiveConvert=true

; 自动同步已有单位的 AttachEffect（需要 Phobos Interop 1.1+ / Phobos v0.5-alpha1+）
; true: 只改单位节里的 AttachEffect.AttachTypes / RemoveTypes / RemoveGroups /
;       DurationOverrides / Delays / InitialDelays / RecreationDelays，
;       重载时自动更新场上已有单位（无需写 [AutoReloader] 命令）
; false: 只更新类型模板，新生产的单位生效
AutoSyncAttachEffects=true
